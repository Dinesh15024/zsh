"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = "$os${custom.docker}${custom.kubernetes}$directory$git_branch$git_status\n╰──$character"

[os]
disabled = false
format = "[$symbol](bold #1793D1) "

[os.symbols]
Linux   = '󰣇'
Ubuntu  = "󰕈"
Artix   = "󰣇"
Arch    = "󰣇"
CachyOS = "󰣇"
Macos   = ""

[directory]
format            = "[$path](cyan) "
truncation_length = 0
truncate_to_repo  = false

[git_branch]
symbol = ""
format = "[$symbol $branch](bold purple) "

[git_status]
format     = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
ahead      = "[⇡$count ](bold cyan)"
behind     = "[⇣$count ](bold cyan)"
diverged   = "[⇡$ahead_count⇣$behind_count ](bold cyan)"
staged     = "[+$count ](bold green)"
modified   = "[●$count ](bold yellow)"
untracked  = "[?$count ](bold white)"
deleted    = "[✘$count ](bold red)"
conflicted = "[⚡$count ](bold red)"

[rust]
symbol = ""
format = "[$symbol $version](red) "

[golang]
symbol = ""
format = "[$symbol $version](cyan) "

[character]
success_symbol = "[❯](green)"
error_symbol   = "[❯](red)"
vimcmd_symbol  = "[❮](blue)"

[custom.docker]
command = "docker context show"
when = "command -v docker"
symbol = ' '
format = "[$symbol](bold #5CA9FF)"

[custom.kubernetes]
command = "kubectl config current-context"
when = "timeout 1 kubectl get nodes >/dev/null 2>&1"
symbol = "󱃾"
format = "[$symbol](bold #4169E1) "
ignore_timeout = true
shell = ["bash", "--noprofile", "--norc"]

